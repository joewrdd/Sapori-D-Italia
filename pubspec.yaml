name: saporidiitalia
description: Italian Based Food App.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.16.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.0.0
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  animated_bottom_navigation_bar: ^1.4.0
  flutter_svg: ^2.0.17
  scroll_to_index: ^3.0.1
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/mainLogo.png"
  image_path_android: "assets/icons/mainLogo.png"
  image_path_ios: "assets/icons/mainLogo.png"
  adaptive_icon_foreground: "assets/icons/mainLogo.png"
  min_sdk_android: 33
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
